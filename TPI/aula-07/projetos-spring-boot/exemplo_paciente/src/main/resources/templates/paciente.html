<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dados Paciente</title>
    <style>
        body {font-family: Verdana; text-align: center; margin-top: 100px;}
        .dados{border: 1px solid #d0d0d0; padding: 30px; border-radius: 10px;}
    </style>
</head>
<body>
    <div class="dados">
        <h1>Dados do Paciente</h1>
        <p th:text="${nome_paciente}"></p>
        <p>Telefone: <strong th:text="${telefone_paciente}"></strong></p>
    </div>
</body>
</html>
